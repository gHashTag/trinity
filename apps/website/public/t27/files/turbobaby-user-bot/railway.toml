[build]
builder = "DOCKERFILE"

[deploy]
# Cycle #117: was `/api/admin/ping` which always returns 200 regardless
# of backend state. `/health` now pings the DB (SELECT 1) and returns
# 503 on failure so Railway stops routing traffic to a container whose
# DB is unreachable. See src/api/mod.rs::health_handler for the impl.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.multiRegionConfig]
# The customer base is in Thailand. Serving a 700 KB compressed WASM bundle
# from Railway's SFO replica was measured at 1–5 KB/s and caused WebKit
# `TypeError: Load failed`. Singapore is Railway's nearest supported region.
"asia-southeast1-eqsg3a" = { numReplicas = 1 }
