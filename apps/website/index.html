  <!-- Fonts, self-hosted. These used to come from fonts.googleapis.com: a
       render-blocking stylesheet on a third-party origin, which then pulled the
       actual .woff2 files from a second origin — two DNS+TLS handshakes before
       any text could paint. The request also asked for Inter, which nothing in
       the app references, and for three families across 13 weights: 59
       @font-face declarations, 15 files, 324 kB.
       These are the variable versions, so one file covers every weight, and
       only the subsets that are actually used: Outfit has no Cyrillic on Google
       Fonts at all (Russian already fell back to system-ui), JetBrains Mono
       does, so its Cyrillic subset is kept and loads only when Cyrillic is
       rendered. 72 kB total, same origin, no blocking stylesheet. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/outfit-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="fonts/jetbrains-mono-latin.woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url(fonts/outfit-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;
      src: url(fonts/jetbrains-mono-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;
      src: url(fonts/jetbrains-mono-cyrillic.woff2) format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    /* First-paint shell. #root was empty, so nothing at all was on screen until
       the JS had downloaded, parsed and mounted, and anything that does not run
       JS saw an empty document. React clears these children on its first render.
       The copy is injected at build time from messages/en.json by the
       prerender-hero plugin in vite.config.ts, so it cannot drift from the hero
       it stands in for — what is written below is only the fallback for `vite`
       runs where the plugin has not replaced it. */
    html { background: #000; }
    #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; padding: 2rem; text-align: center; }
    #boot img { width: min(46vw, 240px); height: auto; }
    #boot h1 { font-family: 'Outfit', system-ui, sans-serif; font-weight: 600; font-size: clamp(0.7rem, 2.2vw, 0.85rem); letter-spacing: 0.14em; text-transform: uppercase; color: #00FF88; max-width: 42ch; margin: 0; }
    #boot .eq { font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 700; color: #fff; margin: 0; }
    #boot .sub { font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(0.85rem, 2vw, 1rem); color: #888; max-width: 56ch; margin: 0; line-height: 1.5; }
    #boot .btns { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    #boot .btns a { font-family: 'Outfit', system-ui, sans-serif; font-size: 0.9rem; font-weight: 600; padding: 0.7rem 1.4rem; border-radius: 999px; text-decoration: none; border: 1px solid rgba(255,255,255,0.16); color: #fff; }
    #boot .btns a.primary { background: #00FF88; border-color: #00FF88; color: #000; }
  </style>

<body>
  <div id="root">

      <img src="trinity-logo-with-label.svg" alt="TRINITY" width="1080" height="1080" />
      <h1>Native ternary hardware for AI</h1>
    </div><!-- /boot -->
  </div>
  <!-- GitHub Pages SPA redirect handler -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
