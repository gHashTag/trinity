# fly.toml — FPGA Synthesis Service
app = "trinity-fpga-synth"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.simple"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[vm]
  cpu = 1
  memory = "256mb"
