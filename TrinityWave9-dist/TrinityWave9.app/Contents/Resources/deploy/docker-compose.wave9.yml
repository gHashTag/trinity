services:
  wave9-worker-1:
    build:
      context: ../../
      dockerfile: Dockerfile.hslm-train
    container_name: wave9-worker-1
    environment:
      - HSLM_PROFILE=s3multiobj
      - HSLM_NTP_WEIGHT=0.5
      - HSLM_JEPA_WEIGHT=0.25
      - HSLM_NCA_WEIGHT=0.25
      - HSLM_JEPA_ENABLED=true
      - HSLM_CTX=81
      - HSLM_LR=0.001
      - HSLM_BATCH=66
    volumes:
      - ./data/wave9:/data/wave9
