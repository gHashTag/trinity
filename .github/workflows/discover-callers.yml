name: Discover RTL check callers

# Who is actually using the check, read from GitHub rather than from memory.
#
# The gallery on t27.ai was hand-written, which makes it a portfolio: it shows
# what I chose to show. This discovers callers instead, so the page can say how
# many repositories use the check without me being the one who counts.
#
# It can only work because the check runs in the customer's repository: their
# workflow file and their run conclusions are public, and nothing has to be
# uploaded to me. The property that makes the service acceptable to a chip
# designer is the same one that makes its gallery self-maintaining.

on:
  # No schedule: block. The Queen (Inngest app t27-queen) dispatches this workflow
  # on '41 5 * * *' UTC from the card specs/crons/trinity-discover-callers.t27 in gHashTag/t27.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # code search is rate-limited (HTTP 429); retry with backoff, then
          # keep the previous answer rather than failing the scheduled run.
          for wait in 0 60 180; do
            sleep "$wait"
            if python3 tools/discover_rtl_check_callers.py \
                 --out apps/website/src/data/communityRuns.json; then exit 0; fi
          done
          git checkout -- apps/website/src/data/communityRuns.json 2>/dev/null || true
          echo "::warning::code search still rate-limited after retries — keeping the previous communityRuns.json"

      # The report shown on the page comes from a real run, so it has to be
      # refreshed with the same cadence as everything else it sits beside.
      - name: Refresh the example report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/fetch_run_report.py \
            --repo gHashTag/trinity-fpga --workflow rtl-check.yml \
            --min-jobs 2 --min-lines 4 \
            --out apps/website/src/data/exampleReport.json

      # The badges on /start claim each check's self-test is currently green.
      # A claim in the present tense has to be refreshed or it becomes a claim
      # about the past wearing present-tense words.
      - name: Refresh the self-test verdicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/check_status_report.py apps/website/src/data/checkStatus.json

      - name: Commit if the answer changed
        run: |
          set -uo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          N=$(python3 -c "import json;print(len(json.load(open('apps/website/src/data/communityRuns.json'))['entries']))")
          say "## Callers discovered: $N"
          git config user.name  'caller discovery'
          git config user.email 'admin@t27.ai'
          git add apps/website/src/data/communityRuns.json apps/website/src/data/exampleReport.json apps/website/src/data/checkStatus.json
          if git diff --cached --quiet; then
            say "- no change"
            exit 0
          fi
          git commit -q -m "Discovered callers: $N"
          if ! git push -q; then
            say "- push rejected (branch protection on main); not published"
            echo "::warning::push to the default branch was rejected by repository rules"
            exit 0
          fi
          say "- committed"
