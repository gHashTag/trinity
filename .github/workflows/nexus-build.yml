name: Trinity Nexus Build

on:
  # Added so this workflow's verdict can be refreshed. Without a manual
  # trigger and behind a path filter, its status is whatever its last
  # run concluded — here, 14 August — and there is no way to find out
  # whether that is still true short of an unrelated commit that happens
  # to touch its paths. A red that cannot be re-tested is not a signal.
  workflow_dispatch:
  push:
    branches: [ralph/*, main]
    paths:
      - 'trinity-nexus/**'
      - '.github/workflows/nexus-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trinity-nexus/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core, lang, symb, network, canvas, tools]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build ${{ matrix.module }}
        working-directory: trinity-nexus
        run: zig build

      - name: Test ${{ matrix.module }}
        working-directory: trinity-nexus
        run: zig build test-${{ matrix.module }}

  build-all:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build all modules
        working-directory: trinity-nexus
        run: zig build

      - name: Run all tests
        working-directory: trinity-nexus
        run: zig build test
