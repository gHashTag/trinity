# Temporary probe. Delete once the macOS release build is green.
#
# Every macOS release job, in every one of the four release workflows, has
# failed at the same place: the link of build_zcu.o -- the build runner itself --
# with every libSystem symbol undefined (_abort, _dispatch_semaphore_create,
# _waitpid, ...). The choice of std.heap.CAllocator in that same object proves
# the compilation believed builtin.link_libc was true, so this is not a missing
# `.link_libc = true` in build.zig: the toolchain decided to link libc and then
# did not find libSystem.
#
# The hypothesis this probe tests is that `macos-latest` has moved to a macOS
# whose SDK layout Zig 0.15.2 (released before it) cannot resolve. So: run the
# identical setup on three runner images, and isolate toolchain from repo by
# linking a five-byte program against libc before touching build.zig.
name: zig macOS probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.runner }} / zig ${{ matrix.zig }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15, macos-14]
        zig: ['0.15.2']
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: What machine is this
        run: |
          sw_vers
          uname -m
          echo "xcode-select: $(xcode-select -p 2>&1)"
          echo "sdk path: $(xcrun --show-sdk-path 2>&1)"
          echo "sdk version: $(xcrun --show-sdk-version 2>&1)"

      - name: What zig is this
        run: |
          zig version
          zig env

      # Toolchain or repository? A program with an empty main still pulls in
      # the std start code, and -lc forces the libSystem link that fails above.
      - name: Link a trivial program against libc
        run: |
          echo 'pub fn main() void {}' > /tmp/probe.zig
          zig build-exe /tmp/probe.zig -lc -femit-bin=/tmp/probe && echo "TRIVIAL LIBC LINK: ok" || echo "TRIVIAL LIBC LINK: FAILED"

      # The real failing step, reduced: -h compiles and runs the build runner
      # without building a single artifact, which is exactly the object that
      # fails to link. Never fails the job -- the log is the result.
      - name: Compile and run the build runner
        run: |
          zig build -h > /tmp/buildhelp.txt 2>/tmp/builderr.txt && echo "BUILD RUNNER: ok" || echo "BUILD RUNNER: FAILED"
          echo "--- first 40 lines of stderr"
          head -40 /tmp/builderr.txt || true
          echo "--- declared options (the release workflows pass -Drelease-safe, -Draylib, -Dtreesitter)"
          grep -A100 'Project-Specific Options' /tmp/buildhelp.txt | head -40 || true
