# Temporary instrument, deleted before this branch merges.
#
# Three questions the release workflows cannot answer by reading:
#   1. Does the default build step actually install `firebird`, or only
#      tri + vibee? trinity-binary-release.yml copied it with a `[ -f ] ||
#      echo "not found"` guard, which is how that workflow shipped archives
#      nobody checked.
#   2. What is the FULL error list for src/vibeec? Zig analyses lazily, so
#      each fix exposes the next wave; the local toolchain is 0.16.0 and
#      cannot stand in for 0.15.2.
#   3. Does Extension Release produce loadable zips now that its paths point
#      at deploy/trinity-nexus/extensions and the manifests are back? A zip
#      without manifest.json is a zip Chrome refuses to load.
name: release probe

on:
  push:
    branches: [fix/release-workflows]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.15.2

jobs:
  bins:
    name: what the default step installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: |
          zig build -Dtarget=x86_64-linux-gnu.2.35 -Doptimize=ReleaseSafe -Dci=true
          echo "=== zig-out/bin"
          ls -la zig-out/bin/

  vibeec:
    name: every error in src/vibeec
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # `| tail` would make the pipeline's status tail's, so the step could
      # never report a failure. Capture, then decide on the captured text.
      - run: |
          cd src/vibeec
          set +e
          zig build -Doptimize=Debug > /tmp/vibeec.log 2>&1
          rc=$?
          set -e
          tail -150 /tmp/vibeec.log
          echo "=== exit $rc, $(grep -c 'error:' /tmp/vibeec.log) error lines"

  extension:
    name: extension packages end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build WASM module
        run: |
          zig build-exe src/firebird/neodetect_wasm.zig \
            -target wasm32-freestanding \
            -O ReleaseFast \
            -fno-entry \
            -rdynamic \
            -femit-bin=deploy/trinity-nexus/extensions/chrome/wasm/neodetect.wasm
          ls -la deploy/trinity-nexus/extensions/chrome/wasm/neodetect.wasm
      - name: Sync, package, and look inside the zips
        run: |
          cd deploy/trinity-nexus/extensions
          cp chrome/wasm/neodetect.wasm firefox/wasm/
          cp chrome/icons/*.png firefox/icons/
          cp chrome/wasm/neodetect-loader.js firefox/wasm/
          cp chrome/popup/popup.html firefox/popup/
          sed 's/chrome\./browser./g' chrome/popup/popup.js > firefox/popup/popup.js
          sed 's/chrome\./browser./g' chrome/content/content.js > firefox/content/content.js
          (cd chrome && zip -qr ../probe-chrome.zip . -x "*.DS_Store" -x "*.md")
          (cd firefox && zip -qr ../probe-firefox.zip . -x "*.DS_Store" -x "*.md")
          echo "=== chrome zip"; unzip -l probe-chrome.zip
          echo "=== firefox zip"; unzip -l probe-firefox.zip
          # The one thing that decides whether these are installable.
          unzip -p probe-chrome.zip manifest.json  | jq -e '.manifest_version == 3'
          unzip -p probe-firefox.zip manifest.json | jq -e '.manifest_version == 2'
