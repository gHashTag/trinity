name: Website static checks

# The website has had a typecheck, an API-contract check, a render check and an
# ARIA-reference check for some time. Until now CI ran none of them: they were
# manual commands, so they ran when someone remembered.
#
# That is how the mobile language switcher shipped broken — the check that finds
# it existed and nothing invoked it — and how a dangling aria-controls="mobile-menu"
# sat in the tree.
#
# The static half needs no browser. `check:render` does — it drives real Chrome
# over a built dist — and was held back until it proved itself stable, because a
# flaky gate gets muted within a week.
#
# It has now proved it: seven consecutive runs, 7 pass / 0 fail, identical
# results every time (2 popups at desktop width, 2 at 390px, 4 panels expanded),
# 47-59s each. The machine's load average doubled during the measurement, 6.89
# to 15.01, and nothing moved. So it is wired here, in its own job so a browser
# failure is distinguishable from a typecheck failure at a glance.

on:
  # workflow_dispatch, because the path filter means a change to this file
  # cannot trigger the workflow that the change is to -- which is how the render
  # job sat wired but unexecuted from the moment it merged.
  workflow_dispatch:
  pull_request:
    paths: ['apps/website/**']
  push:
    branches: [main, master]
    paths: ['apps/website/**']

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Every ARIA reference resolves to a declared id
        run: npm run check:aria
      # `npm run typecheck` has never passed on this codebase: 184 errors across
      # 27 files, none of them in the pages this workflow exists to protect.
      # Wiring the gate to it made the whole workflow red on the day it merged,
      # which is the same as having no gate — and it put a failure that has
      # nothing to do with rendering next to the render job.
      #
      # The ratchet fails on any file that GAINS errors and lowers the baseline
      # when they are fixed, so the debt stays countable and a regression still
      # stops a PR. --selftest runs first because a gate nobody has watched fail
      # is a gate whose behaviour nobody knows.
      - name: The type-error ratchet can fail
        run: npm run typecheck:ratchet -- --selftest
      - name: No file gained type errors
        run: npm run typecheck:ratchet

  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      # Chrome is preinstalled on ubuntu-latest runners; render-check speaks CDP
      # directly and pulls in no browser dependency of its own.
      - name: Build
        run: npm run build
      - name: Page renders, panels expand, popups are reachable
        run: npm run check:render -- --no-build
