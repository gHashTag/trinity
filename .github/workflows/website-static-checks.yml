name: Website static checks

# The website has had a typecheck, an API-contract check, a render check and an
# ARIA-reference check for some time. Until now CI ran none of them: they were
# manual commands, so they ran when someone remembered.
#
# That is how the mobile language switcher shipped broken — the check that finds
# it existed and nothing invoked it — and how a dangling aria-controls="mobile-menu"
# sat in the tree.
#
# The static half needs no browser. `check:render` does — it drives real Chrome
# over a built dist — and was held back until it proved itself stable, because a
# flaky gate gets muted within a week.
#
# It has now proved it: seven consecutive runs, 7 pass / 0 fail, identical
# results every time (2 popups at desktop width, 2 at 390px, 4 panels expanded),
# 47-59s each. The machine's load average doubled during the measurement, 6.89
# to 15.01, and nothing moved. So it is wired here, in its own job so a browser
# failure is distinguishable from a typecheck failure at a glance.

on:
  pull_request:
    paths: ['apps/website/**']
  push:
    branches: [main, master]
    paths: ['apps/website/**']

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Every ARIA reference resolves to a declared id
        run: npm run check:aria
      - name: Typecheck
        run: npm run typecheck

  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      # Chrome is preinstalled on ubuntu-latest runners; render-check speaks CDP
      # directly and pulls in no browser dependency of its own.
      - name: Build
        run: npm run build
      - name: Page renders, panels expand, popups are reachable
        run: npm run check:render -- --no-build
