# The three checks that exist and never run.
#
# anomaly-register A48: this project does not fail by missing things. Its site
# audit, its claim-guard and its five-label framework all caught the same
# overclaims -- and every one of them failed at the step AFTER the finding. The
# audit was written, then deleted, and the numbers stayed for six months.
#
# So these run on every PR that touches the site. Each was written the day its
# failure was found and each has been run by hand since, which is another way
# of saying each has been forgotten at least once.
#
#   typecheck:ratchet  errors may fall, never rise (A31: `npm run build` claimed
#                      to typecheck, never ran in the deploy path, and 231
#                      errors accrued unseen -- among them seven React branches
#                      that were statically false, so four panels rendered
#                      nothing in production)
#   check:api          a field the UI formats that no server emits, and any
#                      fallback not tagged with sample() (A36/A37: novelty:0.342
#                      rendered as an FPGA measurement on a public route)
#   audit:mobile       no route scrolls sideways at 375px (A50: /specs kept its
#                      desktop two-pane layout on a phone, leaving ~150px for
#                      the detail; nothing was checking the other 27 routes, and
#                      /dashboard was over by 13px)
#   check:silicon      every spec naming a silicon-verified format is classified
#                      -- mapped, family, or excluded WITH a reason (A44: the
#                      corpus carries the GF ladder three times, the first table
#                      listed one root, and twelve specs describing formats
#                      measured on silicon rendered "No hardware run")
#   check:render       real Chrome over CDP, every panel on all nine canvas
#                      layers, fails on the first uncaught error (A39: vite
#                      build was green through all of the above -- it proves
#                      the bundler succeeded, not that the page renders)
name: Website checks

on:
  pull_request:
    paths: ['apps/website/**', '.github/workflows/website-checks.yml']
  push:
    branches: [main]
    paths: ['apps/website/**']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # render-check uses the WebSocket client built into 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - run: npm ci

      # Every aria-controls / aria-labelledby / aria-describedby resolves to an
      # id that is actually declared. A dangling aria-controls="mobile-menu" sat
      # in the tree until this was written.
      - name: ARIA references resolve
        run: npm run check:aria

      # Not a gate on the count, a gate on the DIRECTION, and per file: a scalar
      # total passes when one file is fixed and another breaks by the same
      # amount. --selftest first, so a gate nobody has watched fail is not
      # trusted on the day it matters. 184 across 27 files today.
      - name: the ratchet can fail
        run: npm run typecheck:ratchet -- --selftest
      - name: typecheck ratchet
        run: npm run typecheck:ratchet

      # Compares names only -- it cannot see units, which is why A34's five
      # mappable fields stay unwired rather than relabelled as microseconds.
      - name: API contract
        run: npm run check:api

      # Runs its own --self-test first: it injects an unclassified gf16 path and
      # requires the detector to report it, so the gate cannot pass by looking
      # at nothing. It reads the real tables by compiling siliconHistory.ts,
      # not by pattern-matching its source.
      - name: Silicon coverage
        run: npm run check:silicon

      # The three catalogs behind the Explorer tabs. Each is generated from an
      # artifact -- the spec corpus, the skill files, the source of every
      # scheduled job -- so each gets a gate that re-reads the artifact rather
      # than trusting the committed JSON.
      - name: Skill catalog
        run: npm run check:skills-catalog
      - name: Cron catalog
        run: npm run check:crons-catalog
      # The console reads one person's correspondence in a browser tab. This
      # asserts the four properties that keep that from being a leak: no service
      # key anywhere under src/, exactly one identity header per request, three
      # endpoints only, and no tool that can send.
      - name: Clients console cannot send
        run: npm run check:clients-console
      # The Explorer pages carry their own en/ru dictionaries instead of the
      # site catalogues, and a locale that gains a key alone rots silently.
      - name: Explorer languages
        run: npm run check:explorer-languages
      - name: Catalog generators
        run: npm run test:sync-skills && npm run test:sync-crons
      # The tiers, the touch minimum and the QA matrix come from
      # specs/ui/viewport.t27 through the compiler; the two generated files
      # must be the ones the vendored spec produces, and the generator must
      # still refuse a spec whose own tests do not hold.
      - name: Viewport spec
        run: npm run check:viewport && npm run test:viewport-spec
      # The world scan's contract (specs/catalog/discovery.t27 through the compiler),
      # its pure decisions, and the manifest merge that must never touch a founding
      # source. The scan itself runs against GitHub in t27-world-scan.yml.
      - name: t27 world discovery
        run: npm run check:discovery

      - name: Build
        run: npx vite build

      # Skips itself if no Chrome is found rather than failing: a missing
      # browser is an environment fact, not a defect in the change.
      - uses: browser-actions/setup-chrome@v1
        id: chrome

      # Проверяет все маршруты в обеих локалях. Скрипты имеют собственные
      # самотесты и используют Chrome через CDP без новой зависимости npm.
      - name: Language audits
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm run audit:en -- --selftest
          npm run audit:ru -- --selftest
          python3 -m http.server 4173 --directory dist >/tmp/t27-language-audit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html?lang=en' npm run audit:en
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html?lang=ru' npm run audit:ru
          # Same server, same Chrome harness, one more question: does any route
          # scroll sideways at 375px. Runs its own --selftest first.
          npm run audit:mobile -- --selftest
          # Both locales: the Russian chrome is wider than the English, and the
          # /specs language switcher was pushed off a 375px screen in RU while
          # fitting in EN. A single-locale run would have passed it.
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html' npm run audit:mobile
          AUDIT_BASE_URL='http://127.0.0.1:4173/index.html?lang=ru' npm run audit:mobile

      - name: Render check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:render -- --no-build

      # The five explorers and the spec explorer at every size in the spec's
      # matrix: one pane on a phone, two above, the deep-linked card open and
      # on screen, 44px controls where a finger is the pointer, one scroller
      # per pane, nothing sideways. Skips itself without Chrome.
      - name: Explorer viewport contract
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check:explorer-viewport -- --no-build

      # A51: four PRs merged, every check green, and the live site changed
      # nothing -- this app deploys from a second repository that holds build
      # output only, copied there by hand. Every check above runs against the
      # source, so all of them pass on a tree whose output nobody published.
      #
      # This one fetches t27.ai and compares the entry bundle. It never fails
      # the job: a merge is not a deploy, and blocking one on the other
      # inverts the order. It is here so the gap is visible in the log rather
      # than discovered a week later in the site's <head>.
      - name: Is the live site this build?
        continue-on-error: true
        run: npm run check:deployed
