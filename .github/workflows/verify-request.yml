name: Verification request

# Runs the automated stage of a verification request and posts the result back
# into the issue, so a request needs no correspondence to get started.
#
# What this can decide on its own: whether the design elaborates, whether it
# synthesises, whether it infers latches, what it costs in cells, and — where the
# requester supplied a testbench — whether that passes. Those are the checks that
# do not need a human, and they are also the ones that most often fail.
#
# What it deliberately does not do: write the independent reference model. That is
# the part with the value in it, it has to be derived from the description of what
# the design should do rather than from the design, and no bot can do it. The
# comment says so plainly rather than implying the whole report is automatic.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'verification-request')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Acknowledge, so nobody is left wondering
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '**Picked up.** The automated stage is running now: elaboration, synthesis,',
                'a latch check and a cell count, plus your own testbench if the repository',
                'has one. Results land in this issue in a few minutes.',
                '',
                'The part that follows is the part that matters and is not automated —',
                'an independent reference model written from your description of what the',
                'design should do, never from your RTL. A model derived from your code',
                'would agree with your code, including where it is wrong.',
              ].join('\n')
            })

      - name: Read the request
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || ''
            // Issue-form bodies are "### Label\n\nvalue" blocks.
            const field = (label) => {
              const m = body.match(new RegExp('### ' + label + '\\s*\\n+([\\s\\S]*?)(?=\\n### |$)'))
              const v = m ? m[1].trim() : ''
              return v === '_No response_' ? '' : v
            }
            const repo = field('Where is the RTL\\?')
            const top = field('Top module name')
            core.setOutput('repo', repo)
            core.setOutput('top', top)
            // Only clone what is plainly a public GitHub URL. Anything else is
            // left for a human rather than guessed at.
            const ok = /^https:\/\/github\.com\/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+\/?$/.test(repo)
            core.setOutput('clonable', ok ? 'yes' : 'no')
            // The top module name is interpolated into a yosys -p script, and
            // yosys scripts have `exec`, which runs arbitrary programs. Without
            // this test a top of `dut; exec -- sh -c ...` from any issue body
            // executes in the runner, where GITHUB_TOKEN has write scope.
            // Demonstrated locally before this was added: yosys printed
            // `3. Executing command "echo INJECTED_COMMAND_RAN".`
            // A Verilog identifier is the only thing this field may ever be.
            const topOk = /^[A-Za-z_][A-Za-z0-9_$]*$/.test(top) && top.length <= 128
            core.setOutput('topok', topOk ? 'yes' : 'no')

      - name: Install the open toolchain
        if: steps.parse.outputs.clonable == 'yes' && steps.parse.outputs.topok == 'yes'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq yosys iverilog
          # The cell count depends on which yosys this is and apt is unpinned;
          # rtl-check.yml records the version and this path did not.
          yosys -V | grep -oE 'Yosys [^ ]+' | head -1 > "$RUNNER_TEMP/yosys_version"
          yosys -V
          iverilog -V | head -1

      - name: Fetch the design
        if: steps.parse.outputs.clonable == 'yes' && steps.parse.outputs.topok == 'yes'
        env:
          DESIGN_REPO: ${{ steps.parse.outputs.repo }}
        run: |
          set -euo pipefail
          # Passed through the environment rather than interpolated into the
          # shell, so an issue body cannot inject a command.
          git clone --depth 1 "$DESIGN_REPO" design
          find design -name '*.v' -o -name '*.sv' | head -40

      - name: Check it
        if: steps.parse.outputs.clonable == 'yes' && steps.parse.outputs.topok == 'yes'
        id: check
        continue-on-error: true
        env:
          TOP: ${{ steps.parse.outputs.top }}
        run: |
          set -uo pipefail
          SRC=$(find design -name '*.v' -not -name '*_tb.v' -not -path '*/test/*' | tr '\n' ' ')
          ALL_V="$SRC"
          # Drop files that another source `include`s. Passing both the includer
          # and the included file defines every module twice, and yosys stops
          # with "Re-definition of module". That is how the second real run of
          # this path failed: project.v `include`s five siblings, and the glob
          # handed yosys all six.
          INCLUDED=$(grep -rhoE '^[[:space:]]*`include[[:space:]]+"[^"]+"' $SRC 2>/dev/null \
                     | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          if [ -n "$INCLUDED" ]; then
            KEEP=""
            for f in $SRC; do
              b=$(basename "$f")
              case "$INCLUDED" in
                *"$b"*) echo "sources: $b is \`include\`d by another file; not passed separately" ;;
                *) KEEP="$KEEP $f" ;;
              esac
            done
            SRC=$(echo $KEEP)
          fi
          # Dropping included files from the list is only half of it — the
          # tools still have to find them. Without -I, `include "top.v"` fails
          # with "Include file top.v not found" and the design does not
          # elaborate at all.
          INCDIRS=$(for f in $SRC; do dirname "$f"; done | sort -u)
          IFLAGS=""; VFLAGS=""
          for d in $INCDIRS; do IFLAGS="$IFLAGS -I$d"; VFLAGS="$VFLAGS -I $d"; done
          echo "sources: $SRC"
          echo "include path:$IFLAGS"
          if [ -z "$SRC" ]; then
            echo "verdict=no Verilog found" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "### Sources" > report.md
          echo '```' >> report.md
          echo "$SRC" | tr ' ' '\n' | sed '/^$/d' >> report.md
          echo '```' >> report.md

          echo "" >> report.md
          echo "### Elaboration" >> report.md
          ELABORATED=no
          if iverilog -g2012 $IFLAGS -o /dev/null $SRC 2> elab.txt; then
            echo "PASS — elaborates cleanly." >> report.md
            ELABORATED=yes
          else
            echo "FAIL:" >> report.md
            echo '```' >> report.md; head -25 elab.txt >> report.md; echo '```' >> report.md
          fi

          echo "" >> report.md
          echo "### Latch check" >> report.md
          # Two things were wrong here and they compounded.
          #
          # 1. `read_verilog` without -sv reads SystemVerilog as Verilog. On a
          #    real submission that produced "Static cast is only supported in
          #    SystemVerilog mode", yosys exited non-zero, and this branch
          #    reported it as an inferred latch. rtl-check.yml has read -sv all
          #    along; the two paths disagreed about the language.
          #
          # 2. A non-zero exit here means "the assertion did not pass", which
          #    includes "the file would not parse". Reporting that as "a latch
          #    was inferred — the classic bug that only shows up on silicon"
          #    accuses a stranger's design of a defect the checker invented.
          #    Measured on the first real request: with -sv the same design and
          #    the same pass list exit 0. There was no latch.
          if [ "${ELABORATED:-no}" != "yes" ]; then
            echo "NOT ESTABLISHED — the design did not elaborate, so nothing below it was measured." >> report.md
          elif yosys -q -p "read_verilog -sv $VFLAGS $SRC; hierarchy -top $TOP; proc; opt; select -assert-none t:\$_DLATCH_* t:\$dlatch t:\$_DLATCHSR_*" 2> latch.txt; then
            echo "PASS — no latches inferred." >> report.md
          elif grep -qiE "ERROR:|syntax error|is only supported in" latch.txt; then
            echo "NOT ESTABLISHED — the design did not get as far as the latch check, so nothing is claimed about latches:" >> report.md
            echo '```' >> report.md; head -20 latch.txt >> report.md; echo '```' >> report.md
          else
            echo "FAIL — a latch was inferred. This is the classic bug that only shows up on silicon:" >> report.md
            echo '```' >> report.md; head -20 latch.txt >> report.md; echo '```' >> report.md
          fi

          echo "" >> report.md
          echo "### Synthesis, generic mapping" >> report.md
          if [ "${ELABORATED:-no}" != "yes" ]; then
            echo "NOT ESTABLISHED — the design did not elaborate." >> report.md
          elif yosys -p "read_verilog -sv $VFLAGS $SRC; synth -top $TOP; stat" > stat.txt 2>&1; then
            echo '```' >> report.md
            # -q suppressed everything including stat, so this printed an
            # empty code fence and looked like a design with no cells.
            # The range stopped at the first blank line, which falls right
            # after the header — so the block was two "Printing statistics."
            # lines and no numbers. yosys prints several stat passes; the last
            # one is the design after synthesis. Take from there, and prefer
            # the whole-design total over the per-module breakdown.
            # Tuned against local yosys 0.65 twice and it kept coming back
            # empty from CI, which installs 0.33 from apt: the banner text and
            # the blank-line placement differ between them. Anchor on the
            # counter lines instead, which both versions print, and fall back
            # to the tail of the file rather than to nothing.
            # Four attempts at this extraction came back empty from CI, and
            # every diagnosis was inferred from the RENDERED REPORT — the one
            # artefact that does not contain the evidence. stat.txt goes to the
            # log now. Observability before mutation; I spent four commits
            # doing the reverse.
            echo "stat.txt: $(wc -c < stat.txt) bytes, $(wc -l < stat.txt) lines"
            echo "---- stat.txt (head) ----"; head -40 stat.txt
            echo "---- stat.txt (tail) ----"; tail -20 stat.txt
            echo "-------------------------"
            STATBLOCK=$(grep -E '^[[:space:]]*[0-9]+[[:space:]]+(wires|cells|public wires|wire bits|port bits|ports|memories|processes)([[:space:]]|$)|^[[:space:]]*[0-9]+[[:space:]]+\$' stat.txt | head -40)
            if [ -z "$STATBLOCK" ]; then
              STATBLOCK=$(grep -E 'Number of (wires|cells)' stat.txt | tail -6)
            fi
            if [ -z "$STATBLOCK" ]; then
              STATBLOCK=$(tail -25 stat.txt | grep -vE '^[[:space:]]*$')
            fi
            if [ -z "$STATBLOCK" ]; then
              echo "NOT ESTABLISHED — synthesis produced no statistics block." >> report.md
            else
              printf '%s\n' "$STATBLOCK" >> report.md
            fi
            echo '```' >> report.md
          else
            echo "FAIL:" >> report.md
            echo '```' >> report.md; tail -20 stat.txt >> report.md; echo '```' >> report.md
          fi

          echo "" >> report.md
          echo "### Registers" >> report.md
          # Count over every source in the design, not the deduped list: the
          # files dropped as `include`d are exactly where the registers live.
          # Reading only the list said "this design holds no registers" about a
          # six-stage pipeline.
          POSEDGE=$(grep -rc "posedge" $ALL_V 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          if [ "$POSEDGE" = "0" ]; then
            echo "This design holds no registers, so it has no clock domain and no achieved frequency can belong to it. For a combinational block the comparable figure is propagation delay, not a clock rate." >> report.md
          else
            echo "Sequential design — $POSEDGE clocked blocks. Achieved frequency is measurable and comes in the hardware stage." >> report.md
          fi

      - name: Post the result
        if: always()
        uses: actions/github-script@v7
        env:
          CLONABLE: ${{ steps.parse.outputs.clonable }}
          TOPOK: ${{ steps.parse.outputs.topok }}
        with:
          script: |
            const fs = require('fs')
            let body
            if (process.env.TOPOK !== 'yes') {
              body = [
                '**The top module name was not a plain Verilog identifier, so nothing was run.**',
                '',
                'That field is pasted straight into a synthesis script, so it is restricted',
                'to `[A-Za-z_][A-Za-z0-9_$]*` and nothing else. Edit the issue with just the',
                'module name — `my_core`, not a path, a file name or a command — and the',
                'checks will run on their own.',
              ].join('\n')
            } else if (process.env.CLONABLE !== 'yes') {
              body = [
                '**No public repository given, so the automated stage was skipped.**',
                '',
                'That is not a problem — it just means the run starts by hand. If the',
                'sources are public, edit the issue with a plain',
                '`https://github.com/owner/repo` URL and the checks will run on their own.',
                'If the work is private, say so and an NDA comes first.',
              ].join('\n')
            } else {
              let r = ''
              try { r = fs.readFileSync('report.md', 'utf8') } catch (e) { r = '_The automated stage produced no report; picking this up by hand._' }
              body = [
                '## Automated stage',
                '',
                r,
                '',
                '---',
                '',
                '**What is still to come, and why it is not automated.** The checks above',
                'tell you whether the design builds and whether it is structurally sound.',
                'They cannot tell you whether it computes the right answer. That needs a',
                'reference model written from your description of the operation rather than',
                'from your RTL, known-answer vectors at each pipeline stage, and a replay',
                'on the board — because agreement in simulation does not prove agreement',
                'on silicon.',
                '',
                'Toolchain: `yosys`, `iverilog`. Every command above is in',
                '`.github/workflows/verify-request.yml`, so you can re-run all of it.',
              ].join('\n')
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
