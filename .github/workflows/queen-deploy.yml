name: Queen — build check

# Railway deploys the Queen itself, from its own GitHub hook, the same way
# woody-weed-bot ships. This workflow therefore does NOT deploy: it only proves
# the artefact Railway is about to build actually builds.
#
# It replaces a workflow that pushed a Docker image and called a Railway
# GraphQL mutation. That version ran 35 times between 2026-04-01 and
# 2026-04-03 and succeeded zero times — 32 failures and 3 cancellations, every
# one of them on the same "Build and Push to Railway" step. It could not have
# worked: it pushed to a registry without ever running `docker login`, it
# carried a placeholder project id (90c3f0c8-…-5e123abc4567) instead of the
# real one (e6dfacdc-3eed-48ae-929b-02e87f07f0aa), its `test` job read
# `steps.deploy.outputs` from a different job, and on every run it posted
# "✅ Queen deployed" to issue 476 — a claim that was never once true.
#
# Railway собирает Королеву сам, по своему GitHub-хуку. Этот workflow ничего
# не деплоит — он только доказывает, что артефакт действительно собирается.

on:
  push:
    branches: [main]
    paths:
      - 'apps/queen-web/**'
      - '.github/workflows/queen-deploy.yml'
  pull_request:
    paths:
      - 'apps/queen-web/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/queen-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/queen-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A build that emits nothing still exits 0. Assert the artefact exists,
      # so this check cannot go green on an empty dist.
      - name: Assert the bundle was actually emitted
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -n "$(find dist/assets -name '*.js' -print -quit)" || { echo "no JS bundle emitted"; exit 1; }
          echo "emitted:"
          ls -la dist dist/assets
