# Documentation Quality Check
# Validates documentation links, examples, and structure

name: docs-check

on:
  # Added so this workflow's verdict can be refreshed. Without a manual
  # trigger and behind a path filter, its status is whatever its last
  # run concluded — here, 14 August — and there is no way to find out
  # whether that is still true short of an unrelated commit that happens
  # to touch its paths. A red that cannot be re-tested is not a signal.
  workflow_dispatch:
  push:
    branches: [main, fix/*, feat/*]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs-check.yml'
      - 'specs/ci/**'
      - '.trinity/seals/ci_ci_*.json'
      - 'conformance/ci_*.json'
      - 'scripts/ci-*'
      - 'scripts/docs-*'
      - 'qa/ci-corona-pr-gate.mjs'
      - 'qa/docs-reference-gate.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/docs-check.yml'
      - '.markdown-link-check.json'
      - 'specs/ci/**'
      - '.trinity/seals/ci_ci_*.json'
      - 'conformance/ci_*.json'
      - 'scripts/ci-*'
      - 'scripts/docs-*'
      - 'qa/ci-corona-pr-gate.mjs'
      - 'qa/docs-reference-gate.mjs'

permissions:
  contents: read

jobs:
  markdown-link-check:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install locked docsite dependencies
        run: npm ci --prefix docs --ignore-scripts

      - name: Build real docsite routes
        run: npm run build --prefix docs

      - name: Reference specification and conformance
        run: node scripts/docs-gate-from-spec.mjs --check && node qa/docs-reference-gate.mjs

      - name: Check tracked documentation targets
        run: node scripts/docs-reference-check.mjs --external --report work/docs-reference-report.json

      - name: Upload individual reference observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-reference-observations
          path: work/docs-reference-report.json
          if-no-files-found: warn
          retention-days: 30

  docs-structure:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DOCUMENTATION_INDEX.md exists
        run: |
          if [ ! -f "docs/DOCUMENTATION_INDEX.md" ]; then
            echo "❌ DOCUMENTATION_INDEX.md not found"
            exit 1
          fi
          echo "✅ DOCUMENTATION_INDEX.md exists"

      - name: Check key documentation files
        run: |
          for file in \
            "README.md" \
            "CLAUDE.md" \
            "AGENTS.md" \
            "CONTRIBUTING.md" \
            "docs/ARCHITECTURE.md" \
            "docs/command_registry.md" \
            "docs/tri27/README.md"
          do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file not found"
              exit 1
            fi
          done

      - name: Check MEMORY.md size
        run: |
          MEMORY_FILE=".claude/projects/-Users-playra-trinity-w1/memory/MEMORY.md"
          if [ -f "$MEMORY_FILE" ]; then
            LINES=$(wc -l < "$MEMORY_FILE")
            echo "MEMORY.md: $LINES lines"
            if [ "$LINES" -gt 250 ]; then
              echo "⚠️ MEMORY.md is $LINES lines (should be <200)"
              echo "Consider moving content to topic files"
            else
              echo "✅ MEMORY.md size OK"
            fi
          fi

  command-examples:
    name: Validate README Command Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build tri CLI
        run: |
          zig build tri

      - name: Test basic commands from README
        run: |
          echo "Testing basic commands..."
          ./zig-out/bin/tri --version || true
          ./zig-out/bin/tri help || true
          ./zig-out/bin/tri constants || true
          echo "✅ Basic commands work"

  docs-index-updated:
    name: Check Documentation Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DOCUMENTATION_INDEX.md timestamp
        run: |
          if grep -q "Last updated: 2026-03-2[0-9]" docs/DOCUMENTATION_INDEX.md; then
            echo "✅ DOCUMENTATION_INDEX.md timestamp is current (March 2026)"
          else
            echo "⚠️ DOCUMENTATION_INDEX.md may need update"
            echo "Last updated date should be recent"
          fi

      - name: Check for broken section links
        run: |
          cd docs
          for section in $(grep -oP '(?<=^\[)[^\]]+(?=\])' DOCUMENTATION_INDEX.md 2>/dev/null | tr '[:upper:]' '[:lower:]'); do
            if grep -q "^## $section" *.md 2>/dev/null || \
               grep -q "^## $section" DOCUMENTATION_INDEX.md 2>/dev/null; then
              echo "✅ Section: $section"
            else
              echo "⚠️ Section link may be broken: $section"
            fi
          done

  consistency-check:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI gate specification and conformance
        run: node scripts/ci-gate-from-spec.mjs --check && node qa/ci-corona-pr-gate.mjs

      - name: Read pinned model source
        id: training
        run: node scripts/docs-model-consistency.mjs --policy

      - name: Checkout moved T-JEPA source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.training.outputs.repo }}
          ref: ${{ steps.training.outputs.rev }}
          path: work/docs-training
          persist-credentials: false
          sparse-checkout: src/hslm

      - name: Check T-JEPA status consistency
        run: node scripts/docs-model-consistency.mjs --check work/docs-training

      - name: Check version consistency
        run: |
          VERSION=$(grep -oP 'v\d+\.\d+\.\d+' README.md | head -1)
          if [ -n "$VERSION" ]; then
            echo "Found version: $VERSION"
            echo "✅ Version declared in README.md"
          else
            echo "⚠️ No version found in README.md"
          fi

  summary:
    name: Documentation Check Summary
    runs-on: ubuntu-latest
    needs: [markdown-link-check, docs-structure, command-examples, docs-index-updated, consistency-check]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Documentation Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Link Check | ${{ needs.markdown-link-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Structure | ${{ needs.docs-structure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Examples | ${{ needs.command-examples.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Index | ${{ needs.docs-index-updated.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Consistency | ${{ needs.consistency-check.result }} |" >> $GITHUB_STEP_SUMMARY
