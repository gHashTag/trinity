name: Build path check

# Does every path your build names actually exist?
#
# Runs in YOUR repository, on YOUR runner, against YOUR checkout. Nothing is
# uploaded anywhere and this workflow has no access to anything of mine.
#
#   jobs:
#     paths:
#       uses: gHashTag/trinity/.github/workflows/build-paths-check.yml@main
#
# It needs no toolchain and finishes in seconds, which is the point. The build
# it protects can be broken by a file that moved, and detecting that needs no
# compiler -- the file is either there or it is not. A repository of mine spent
# four months red on exactly that, and the only instrument that reported it was
# a build whose red had stopped carrying information.
#
# Run across nine of my public repositories it found one confirmed fault, in a
# library whose CI had been failing since April, and nothing in five others.
# That ratio is what to expect: it is a narrow check, and it says so.

on:
  workflow_call:
    inputs:
      import_roots:
        description: >
          Comma-separated subtrees to check imports in. Defaults to src.
          Widen it deliberately: scanning vendored or archived trees produces
          findings nobody will act on, and a check that is red forever is
          furniture.
        required: false
        default: 'src'
        type: string
      min_files:
        description: 'Fail if fewer than this many .zig files were examined — a scan that walked nothing reports nothing and looks clean.'
        required: false
        default: 1
        type: number
      baseline:
        description: >
          Optional file of known-dangling paths, one per line. Only paths outside
          it fail, and a path repaired but left in the file fails too. Use it on
          an existing repository so the check gates new breakage rather than
          chronic breakage — a check failing on both cannot tell you which
          happened today.
        required: false
        default: ''
        type: string
      tool_ref:
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout your sources
        uses: actions/checkout@v4

      - name: Checkout the checker
        uses: actions/checkout@v4
        with:
          repository: gHashTag/trinity
          ref: ${{ inputs.tool_ref }}
          path: .paths-tool

      - name: Check
        env:
          ROOTS: ${{ inputs.import_roots }}
          MINF: ${{ inputs.min_files }}
          BASE: ${{ inputs.baseline }}
        run: |
          set -uo pipefail
          echo "## Build path check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ARGS="--root . --import-roots $ROOTS --min-files $MINF"
          if [ -n "${BASE:-}" ]; then ARGS="$ARGS --baseline $BASE"; else ARGS="$ARGS --baseline /dev/null"; fi
          # shellcheck disable=SC2086
          python3 .paths-tool/tools/check_build_paths.py $ARGS 2>&1 | tee out.txt
          rc=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "### What this does not establish"
            echo "- That the design is correct, or that it compiles. It checks that the files exist."
            echo "- LIKELY is textual: a name can belong to something else, so it is a bound and not a count."
            echo "- Nothing ran on hardware, and no toolchain was involved."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
