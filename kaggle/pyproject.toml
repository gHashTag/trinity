[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-cognitive-probes"
version = "1.0.0"
description = "Trinity Cognitive Probes - Neuroanatomically-grounded AGI benchmark dataset"
readme = "docs/DATASET_CARD.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Trinity S³AI Team", email = "trinity@github.com"}
]
keywords = [
    "agi",
    "benchmark",
    "cognitive-science",
    "neuroscience",
    "evaluation",
    "llm",
    "trinity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]
openai = ["openai>=1.3.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-generativeai>=0.3.0"]
all = [
    "trinity-cognitive-probes[dev,openai,anthropic,google]"
]

[project.urls]
Homepage = "https://github.com/gHashTag/trinity"
Documentation = "https://github.com/gHashTag/trinity/tree/main/kaggle"
Repository = "https://github.com/gHashTag/trinity.git"
Issues = "https://github.com/gHashTag/trinity/issues"

[project.scripts]
tcp-generate = "generators.gen_tmp:main"
tcp-eval = "eval.runner:main"
tcp-validate = "validate:main"

[tool.setuptools]
packages = []

[tool.setuptools.package-data]
"kaggle" = ["questions/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = ["E501"]  # Line length handled by black

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
