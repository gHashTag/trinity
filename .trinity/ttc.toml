# TTC (Trusted Tri Core) Configuration
# Core Development Law (CDL-1) — All changes to TTC files via tri dev

[ttc]
name = "Trusted Tri Core"
description = "Frozen Zig microkernel following seL4/CompCert/Lean methodology"
version = "1.0.0"

# Frozen Zig files — changes ONLY via tri dev commands
[files]
lexer = "src/tri-lang/lexer.zig"
parser = "src/tri-lang/parser.zig"
ast = "src/tri-lang/ast.zig"
typecheck_core = "src/tri-lang/typecheck_core.zig"
emit_t27 = "src/tri-lang/emit_t27.zig"
emit_zig = "src/tri-lang/emit_zig.zig"
cell = "src/tri/cell.zig"
t27_cli = "src/tri/t27_cli.zig"
coptic = "src/temple/coptic.zig"

[enforcement]
# Maximum allowed LOC for TTC (to prevent scope creep)
max_loc = 3000

# Pre-commit hook must validate TTC signature
signature_required = true

# Core signature format (inserted by tri dev)
core_signature_format = "TRI_CORE_SIGNATURE: tri-dev:{unix_timestamp}:sha256:{hash}"
