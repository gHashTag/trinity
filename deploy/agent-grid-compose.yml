# ============================================================================
# Trinity Grid — Local Docker Compose for Testing
# ============================================================================
# Queen + 27 Agents (alpha through sho)
# Ports: 9001-9027 for agents, 8080 for Queen

version: '3.8'

services:
  # ========================================================================
  # QUEEN (Orchestration Service)
  # ========================================================================
  queen:
    image: ubuntu:22.04
    command: /zig-out/bin/tri queen-backend
    environment:
      - PORT=8080
      - AGENT_DOMAIN=omega
      - SELF_IMPROVE_INTERVAL=3600
      - EPISODE_WINDOW=100
    ports:
      - "8080:8080"

  # ========================================================================
  # AGENTS (27 services)
  # ========================================================================
  {% for agent in ["alpha","beta","gamma","delta","epsilon","zeta","eta","theta","iota","kappa","lambda","mu","nu","xi","omicron","pi","koppa","rho","sigma","tau","upsilon","phi","khi","psi","omega","sampi","sho"] %}
  {{ agent }}:
    image: ubuntu:22.04
    command: /zig-out/bin/tri agent run --domain={{ agent }} --health
    environment:
      - AGENT_DOMAIN={{ agent }}
      - AGENT_PORT={% raw port_map[agent] %}
      - QUEEN_URL=http://host.docker.internal:8080
    ports:
      - "{{ port_map[agent] }}:{{ port_map[agent] }}"
