# TRINITY 27-AGENT GRID — Complete Docker Compose Orchestration
# 27 independent agents + 1 Queen (Omega) orchestration service
# Coptic alphabet domains: alpha, beta, gamma, ..., omega, sampi, sho
# Port allocation: 9001-9026 for agents, 8080 for Queen
#
# RESOURCE PROTECTION:
# - Memory limits prevent OOM killer from affecting host
# - CPU limits prevent one agent from monopolizing cores
# - pids_limit prevents fork bombs
# - read_only + tmpfs prevents disk fill
# - on-failure:N prevents infinite restart loops
#
# Total: 928 MB RAM, 7.25 CPU cores max

version: "3.8"

services:
  # ============================================================================
  # QUEEN (Ω OMEGA) — Central Orchestration Service
  # ============================================================================
  queen:
    image: ubuntu:22.04
    container_name: trinity-queen
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - AGENT_DOMAIN=omega
      - AGENT_PORT=8080
      - SELF_IMPROVE_INTERVAL=3600
      - EPISODE_WINDOW=100
    volumes:
      - queen-state:/trinity/.trinity
      - queen-logs:/var/log/queen
    networks:
      - trinity-grid
    restart: on-failure:5
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.50'
        reservations:
          memory: 16M
          cpus: '0.10'
    read_only: true
    tmpfs:
      - /tmp:size=10M
    pids_limit: 50
    healthcheck:
      test: ["CMD", "/trinity/zig-out/bin/tri", "agent", "run", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # CORE AGENTS (Alpha - Epsilon)
  # ============================================================================

  # Agent Alpha (Ⲁⲁ) — Core bootstrapping, agent lifecycle
  agent-alpha:
    build:
      context: .
