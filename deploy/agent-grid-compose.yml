      - "9001:9001"
    environment:
      - AGENT_DOMAIN=alpha
      - AGENT_PORT=9001
      - QUEEN_URL=http://queen:8080
    volumes:
      - alpha-state:/trinity/.trinity
    networks:
      - trinity-grid
    depends_on:
      queen:
        condition: service_healthy
    restart: on-failure:3
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.25'
        reservations:
          memory: 8M
          cpus: '0.05'
    read_only: true
    tmpfs:
      - /tmp:size=5M
    pids_limit: 20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
